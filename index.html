<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enactus Qena Evaluation System (Cloud)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  <div id="app" class="min-h-screen py-8 px-4 sm:px-6 lg:px-8 flex items-center justify-center"></div>

  <script>
    // Initial Cloud Database structure stored in localStorage (synced across browser tabs, or can be upgraded to remote API)
    let db = JSON.parse(localStorage.getItem('enactus_cloud_db')) || {
      leaders: [
        { id: "hr_pm", name: "PM • HR Leader", pass: "pm123", committee: "PM" },
        { id: "hr_pr", name: "PR • HR Leader", pass: "pr123", committee: "PR" },
        { id: "hr_hr", name: "HR • HR Leader", pass: "hr123", committee: "HR" },
        { id: "hr_media", name: "Media • HR Leader", pass: "media123", committee: "Media" },
        { id: "hr_pres", name: "Presentation • HR Leader", pass: "pres123", committee: "Presentation" },
        { id: "hr_oc", name: "OC • HR Leader", pass: "oc123", committee: "OC" }
      ],
      boardPass: "board123",
      evaluations: []
    };

    function saveDB() {
      localStorage.setItem('enactus_cloud_db', JSON.stringify(db));
    }

    const committees = {
      PM: { name: "PM Committee (Project Management)", techCriteria: ["Research & Problem Identification (10)", "Research Quality & Validation (10)", "Project Planning & Documentation (10)", "Task Execution & Deliverables (10)", "Critical Thinking & Problem Solving (10)", "Project Development & Practical Contribution (10)"] },
      PR: { name: "PR Committee (Public Relations)", techCriteria: ["Communication & Negotiation (10)", "Sponsorship Research & Prospecting (10)", "Outreach & Follow-up (10)", "Partnership Development (10)", "Proposal & Pitch Quality (10)", "Task Execution & Reporting (10)"] },
      HR: { name: "HR Committee (Human Resources)", techCriteria: ["HR Knowledge & Application (10)", "Recruitment & Interviewing (10)", "Data Management & Documentation (10)", "Member Follow-up & Evaluation (10)", "Conflict Handling & Fairness (10)", "Confidentiality & Professional HR Practice (10)"] },
      Media: { name: "Media Committee", techCriteria: ["Content Creation & Copywriting (10)", "Design / Editing Quality (10)", "Branding & Visual Consistency (10)", "Content Planning & Execution (10)", "Creativity & Audience Relevance (10)", "Technical Skills & File Management (10)"] },
      Presentation: { name: "Presentation Committee", techCriteria: ["Presentation Structure & Storytelling (10)", "Research & Content Accuracy (10)", "Slide Design & Visual Communication (10)", "Public Speaking & Delivery (10)", "Persuasion & Audience Engagement (10)", "Rehearsal, Feedback & Improvement (10)"] },
      OC: { name: "OC Committee (Organizing)", techCriteria: ["Event Planning & Preparation (10)", "Logistics & Resource Management (10)", "Coordination & Task Distribution (10)", "On-ground Execution (10)", "Contingency Planning & Problem Solving (10)", "Post-event Reporting & Organization (10)"] }
    };

    const personalCriteria = [
      "Commitment & Attendance (5)",
      "Task Commitment & Responsibility (5)",
      "Social Media Engagement (5)",
      "Respect for Hierarchy & Professionalism (5)",
      "Communication & Responsiveness (5)",
      "Teamwork & Cooperation (5)",
      "Initiative & Problem Solving (5)",
      "Feedback & Improvement (5)"
    ];

    let currentUser = null;
    let activeTab = 'leader';
    let selectedLeaderId = db.leaders[0]?.id;

    function renderLogin() {
      document.getElementById('app').innerHTML = `
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-200">
          <div class="mb-6">
            <h1 class="text-3xl font-extrabold text-slate-900 leading-tight">Evaluation Members</h1>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Enactus Qena</h2>
            <p class="text-slate-500 text-sm">Evaluate each member in the committee. Each leader accesses their members only.</p>
          </div>

          <div class="bg-emerald-50 border border-emerald-300 p-4 rounded-xl mb-6 text-xs text-emerald-900 leading-relaxed">
            <b>Cloud Ready System:</b> Evaluations are saved securely. Send this link to HR leaders to submit evaluations, and Board members can review all records instantly.
          </div>

          <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-xl mb-6 font-bold text-sm">
            <button onclick="switchTab('leader')" class="py-2.5 rounded-lg transition ${activeTab === 'leader' ? 'bg-slate-900 text-white shadow' : 'text-slate-600 hover:text-slate-900'}">
              Leader Login
            </button>
            <button onclick="switchTab('board')" class="py-2.5 rounded-lg transition ${activeTab === 'board' ? 'bg-slate-900 text-white shadow' : 'text-slate-600 hover:text-slate-900'}">
              Board Admin
            </button>
          </div>

          <form onsubmit="handleLogin(event)" class="space-y-4">
            ${activeTab === 'leader' ? `
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Select Leader</label>
                <select id="leaderSelect" onchange="selectedLeaderId=this.value" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-slate-900 outline-none">
                  ${db.leaders.map(l => `<option value="${l.id}" ${l.id === selectedLeaderId ? 'selected' : ''}>${l.name} (${l.committee})</option>`).join('')}
                </select>
              </div>
            ` : `
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Board Administrator</label>
                <input type="text" disabled value="Enactus Qena Board" class="w-full p-3 bg-slate-100 border border-slate-200 rounded-xl text-sm font-medium text-slate-500 cursor-not-allowed" />
              </div>
            `}

            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Password</label>
              <input type="password" id="passwordInput" required placeholder="Enter your password" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-slate-900 outline-none" />
            </div>

            <button type="submit" class="w-full bg-amber-400 hover:bg-amber-500 text-slate-950 font-bold py-3.5 rounded-xl shadow transition mt-2">
              Sign In
            </button>
          </form>
        </div>
      `;
    }

    function switchTab(tab) {
      activeTab = tab;
      renderLogin();
    }

    function handleLogin(e) {
      e.preventDefault();
      const pass = document.getElementById('passwordInput').value.trim();

      if (activeTab === 'board') {
        if (pass === db.boardPass) {
          currentUser = { role: 'board', name: 'Board Administrator' };
          renderDashboard('form');
        } else {
          alert('Incorrect Board Password! (Default: board123)');
        }
      } else {
        const leader = db.leaders.find(l => l.id === selectedLeaderId);
        if (leader && leader.pass === pass) {
          currentUser = { role: 'hr', name: leader.name, committee: leader.committee };
          renderDashboard('form');
        } else {
          alert('Incorrect Password for this Leader! (Default passwords like pm123, pr123, etc.)');
        }
      }
    }

    function renderDashboard(subTab) {
      const commKey = currentUser.role === 'hr' ? currentUser.committee : 'PM';
      const commData = committees[commKey];

      let mainContent = '';

      if (subTab === 'form') {
        mainContent = `
          <form onsubmit="submitEval(event)" class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-slate-50 p-4 rounded-xl border">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Member Full Name</label>
                <input type="text" id="memberName" required placeholder="Enter member name" class="w-full p-2 border rounded-lg text-sm bg-white" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Month</label>
                <select id="evalMonth" class="w-full p-2 border rounded-lg text-sm bg-white">
                  ${['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'].map(m => `<option value="${m}">${m}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Committee</label>
                ${currentUser.role === 'hr' 
                  ? `<input type="text" disabled value="${commData.name}" class="w-full p-2 border rounded-lg text-sm bg-slate-200 font-bold text-slate-700 cursor-not-allowed" />`
                  : `<select id="selectedComm" onchange="renderDashboard('form')" class="w-full p-2 border rounded-lg text-sm bg-white font-bold text-emerald-700">
                       ${Object.entries(committees).map(([k, c]) => `<option value="${k}" ${k === commKey ? 'selected' : ''}>${c.name}</option>`).join('')}
                     </select>`
                }
              </div>
            </div>

            <!-- Personal Evaluation (40 Marks) -->
            <div class="border rounded-xl p-4 bg-emerald-50/40">
              <h2 class="text-lg font-bold text-emerald-800 mb-4">1. Personal Evaluation (Out of 40)</h2>
              <div class="space-y-3">
                ${personalCriteria.map((crit, idx) => `
                  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-3 rounded-lg border gap-2">
                    <span class="text-sm font-medium text-slate-700">${idx + 1}. ${crit}</span>
                    <input type="number" min="0" max="5" value="5" id="per_${idx}" oninput="calculateTotal()" class="w-20 p-1.5 border rounded-lg text-center font-bold text-emerald-700" />
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Technical Evaluation (60 Marks) -->
            <div class="border rounded-xl p-4 bg-sky-50/40">
              <h2 class="text-lg font-bold text-sky-800 mb-4">2. Technical Evaluation: ${commData.name} (Out of 60)</h2>
              <div class="space-y-3">
                ${commData.techCriteria.map((crit, idx) => `
                  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-3 rounded-lg border gap-2">
                    <span class="text-sm font-medium text-slate-700">${idx + 1}. ${crit}</span>
                    <input type="number" min="0" max="10" value="10" id="tech_${idx}" oninput="calculateTotal()" class="w-20 p-1.5 border rounded-lg text-center font-bold text-sky-700" />
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Notes -->
            <div class="border rounded-xl p-4 bg-slate-50 space-y-4">
              <h2 class="text-lg font-bold text-slate-800">3. Monthly Review & Notes</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label class="block text-xs font-semibold text-slate-700 mb-1">Strongest Point</label><input type="text" id="note_strong" class="w-full p-2 border rounded-lg text-sm bg-white" placeholder="e.g. Commitment" /></div>
                <div><label class="block text-xs font-semibold text-slate-700 mb-1">Needs Improvement</label><input type="text" id="note_improve" class="w-full p-2 border rounded-lg text-sm bg-white" placeholder="e.g. Response speed" /></div>
                <div><label class="block text-xs font-semibold text-slate-700 mb-1">Next Month Goal</label><input type="text" id="note_goal" class="w-full p-2 border rounded-lg text-sm bg-white" placeholder="Target goal" /></div>
                <div><label class="block text-xs font-semibold text-slate-700 mb-1">Required Support</label><input type="text" id="note_support" class="w-full p-2 border rounded-lg text-sm bg-white" placeholder="Support needed" /></div>
              </div>
            </div>

            <!-- Final Score & Submit -->
            <div class="flex flex-col sm:flex-row justify-between items-center bg-slate-900 text-white p-6 rounded-2xl gap-4">
              <div>
                <span class="text-slate-400 text-sm block">Final Total Score:</span>
                <span id="finalScoreDisplay" class="text-3xl font-extrabold text-emerald-400">100 / 100 Marks</span>
              </div>
              <button type="submit" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-3 rounded-xl shadow-lg transition">
                Save & Submit Evaluation
              </button>
            </div>
          </form>
        `;
      } else if (subTab === 'records') {
        const myEvals = currentUser.role === 'board' ? db.evaluations : db.evaluations.filter(e => e.comm === currentUser.committee);
        mainContent = `
          <div class="space-y-4">
            <h2 class="text-xl font-bold text-slate-800">Submitted Evaluations (${myEvals.length})</h2>
            ${myEvals.length === 0 ? '<p class="text-slate-500 text-center py-10 bg-slate-50 rounded-xl border">No evaluations found yet.</p>' :
              myEvals.map(ev => `
                <div class="bg-slate-50 border p-4 rounded-xl flex justify-between items-center">
                  <div>
                    <h3 class="font-bold text-emerald-800 text-lg">${ev.name}</h3>
                    <p class="text-xs text-slate-500">Committee: <b>${committees[ev.comm]?.name || ev.comm}</b> | Month: ${ev.month} | Evaluator: ${ev.evaluator}</p>
                  </div>
                  <span class="bg-emerald-600 text-white px-4 py-1.5 rounded-lg font-extrabold text-sm">${ev.score} / 100</span>
                </div>
              `).join('')}
          </div>
        `;
      } else if (subTab === 'settings' && currentUser.role === 'board') {
        mainContent = `
          <div class="space-y-6 bg-blue-50/50 p-6 rounded-2xl border border-blue-200">
            <h2 class="text-xl font-bold text-blue-900">⚙️ Board Settings & Credentials Management</h2>
            <p class="text-xs text-slate-600">Update leader passwords and usernames instantly for each month rotation.</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${db.leaders.map((l, idx) => `
                <div class="bg-white p-4 rounded-xl border space-y-2">
                  <span class="font-bold text-emerald-700 text-sm block">${l.name}</span>
                  <div><label class="block text-xs text-slate-500">Username ID:</label><input type="text" id="leader_id_${idx}" value="${l.id}" class="w-full p-1.5 border rounded text-xs font-mono font-bold text-blue-700" /></div>
                  <div><label class="block text-xs text-slate-500">Password:</label><input type="text" id="leader_pass_${idx}" value="${l.pass}" class="w-full p-1.5 border rounded text-xs" /></div>
                </div>
              `).join('')}
            </div>
            <div class="text-center pt-4">
              <button onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-xl shadow">Save Credentials</button>
            </div>
          </div>
        `;
      }

      document.getElementById('app').innerHTML = `
        <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden p-6 sm:p-10">
          <div class="flex flex-col sm:flex-row justify-between items-center border-b pb-4 mb-6 gap-4">
            <div>
              <h1 class="text-xl sm:text-2xl font-bold text-emerald-700">Enactus Qena Evaluation System</h1>
              <p class="text-slate-500 text-xs sm:text-sm">User: <span class="font-bold text-slate-800">${currentUser.name}</span></p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="renderDashboard('form')" class="px-3 py-2 rounded-lg text-xs font-bold ${subTab === 'form' ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-700'}">New Evaluation</button>
              <button onclick="renderDashboard('records')" class="px-3 py-2 rounded-lg text-xs font-bold ${subTab === 'records' ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-700'}">Records</button>
              ${currentUser.role === 'board' ? `<button onclick="renderDashboard('settings')" class="px-3 py-2 rounded-lg text-xs font-bold ${subTab === 'settings' ? 'bg-blue-600 text-white' : 'bg-blue-100 text-blue-700'}">⚙️ Settings</button>` : ''}
              <button onclick="handleLogout()" class="bg-red-100 text-red-600 px-3 py-2 rounded-lg text-xs font-bold hover:bg-red-200">Logout</button>
            </div>
          </div>
          ${mainContent}
        </div>
      `;
      if (subTab === 'form') calculateTotal();
    }

    function calculateTotal() {
      let perTotal = 0;
      for (let i = 0; i < 8; i++) perTotal += Number(document.getElementById(`per_${i}`)?.value || 0);
      let techTotal = 0;
      for (let i = 0; i < 6; i++) techTotal += Number(document.getElementById(`tech_${i}`)?.value || 0);
      const final = perTotal + techTotal;
      const display = document.getElementById('finalScoreDisplay');
      if (display) display.innerText = `${final} / 100 Marks`;
    }

    function submitEval(e) {
      e.preventDefault();
      const name = document.getElementById('memberName').value;
      const month = document.getElementById('evalMonth').value;
      const commEl = document.getElementById('selectedComm');
      const comm = currentUser.role === 'hr' ? currentUser.committee : (commEl ? commEl.value : 'PM');
      
      let perTotal = 0;
      for (let i = 0; i < 8; i++) perTotal += Number(document.getElementById(`per_${i}`).value || 0);
      let techTotal = 0;
      for (let i = 0; i < 6; i++) techTotal += Number(document.getElementById(`tech_${i}`).value || 0);
      const score = perTotal + techTotal;

      db.evaluations.unshift({ id: Date.now(), name, month, comm, score, evaluator: currentUser.name });
      saveDB();

      alert(`Evaluation saved successfully for ${name}!\nFinal Score: ${score} / 100`);
      renderDashboard('records');
    }

    function saveSettings() {
      db.leaders.forEach((l, idx) => {
        l.id = document.getElementById(`leader_id_${idx}`).value;
        l.pass = document.getElementById(`leader_pass_${idx}`).value;
      });
      saveDB();
      alert('Leader credentials updated successfully!');
    }

    function handleLogout() {
      currentUser = null;
      renderLogin();
    }

    renderLogin();
  </script>
</body>
</html>
