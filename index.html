<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enactus Qena Evaluation System</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 12px; width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 14px; }
        button { background: #059669; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        button:hover { background: #047857; }
        h2 { text-align: center; color: #34d399; margin-top: 0; }
        label { font-size: 12px; color: #94a3b8; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box" id="app">
        <h2>Enactus Qena</h2>
        <p style="text-align: center; font-size: 12px; color: #64748b; margin-bottom: 20px;">System Login</p>

        <label>Select Role:</label>
        <select id="role" onchange="toggleRole()">
            <option value="leader">HR Leader</option>
            <option value="board">Board Admin</option>
        </select>

        <div id="leaderDiv">
            <label>Select Committee:</label>
            <select id="comm">
                <option value="PM">PM</option>
                <option value="PR">PR</option>
                <option value="HR">HR</option>
                <option value="Media">Media</option>
            </select>

            <label>Leader Name:</label>
            <input type="text" id="leaderName" placeholder="Enter your name">
        </div>

        <label>Password:</label>
        <input type="password" id="pass" placeholder="Enter password">

        <button onclick="login()">Sign In</button>
    </div>

    <script>
        const BOARD_PASSWORD = "board123";

        function toggleRole() {
            const role = document.getElementById('role').value;
            document.getElementById('leaderDiv').style.display = role === 'board' ? 'none' : 'block';
        }

        function login() {
            const role = document.getElementById('role').value;
            const pass = document.getElementById('pass').value.trim();

            if (role === 'board') {
                if (pass === BOARD_PASSWORD) {
                    alert('Board Admin Logged In Successfully!');
                    // هنا هننقل لوحة التحكم كاملة بمجرد ما تدخل
                } else {
                    alert('Wrong Board Password! Please use: board123');
                }
            } else {
                const name = document.getElementById('leaderName').value.trim();
                if (!name) {
                    alert('Please enter your leader name.');
                    return;
                }
                alert(`Welcome ${name}! Logged in successfully.`);
            }
        }
    </script>
</body>
</html>
