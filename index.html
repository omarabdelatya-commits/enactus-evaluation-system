<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enactus Qena System</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 30px; border-radius: 15px; width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { color: #34d399; text-align: center; margin-top: 0; }
    input, select { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #059669; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background: #047857; }
    .logout { background: #dc2626; margin-top: 15px; }
    .logout:hover { background: #b91c1c; }
  </style>
</head>
<body>

  <div class="card" id="app">
    <!-- شاشة تسجيل الدخول -->
    <h2>Enactus Qena</h2>
    <p style="text-align: center; font-size: 13px; color: #94a3b8;">Evaluation Platform</p>
    
    <label style="font-size: 12px;">Login As:</label>
    <select id="loginType" onchange="toggleLogin()">
      <option value="hr">HR Leader</option>
      <option value="board">Board Admin</option>
    </select>

    <div id="hrBox">
      <label style="font-size: 12px;">Select Leader:</label>
      <select id="leaderSelect">
        <option value="omar">Omar (PM)</option>
      </select>
    </div>

    <label style="font-size: 12px;">Password:</label>
    <input type="password" id="passBox" placeholder="Enter Password">

    <button onclick="login()">Sign In</button>
  </div>

  <script>
    // قاعدة البيانات البسيطة والثابتة
    let db = JSON.parse(localStorage.getItem('simple_db')) || {
      leaders: [{ id: 'omar', name: 'Omar', comm: 'PM', pass: '123' }],
      members: []
    };

    function save() {
      localStorage.setItem('simple_db', JSON.stringify(db));
    }

    function toggleLogin() {
      const type = document.getElementById('loginType').value;
      document.getElementById('hrBox').style.display = type === 'board' ? 'none' : 'block';
    }

    function login() {
      const type = document.getElementById('loginType').value;
      const pass = document.getElementById('passBox').value;

      if (type === 'board') {
        if (pass === 'board123') {
          showBoardDashboard();
        } else {
          alert('Wrong Board Password! Use: board123');
        }
      } else {
        const leaderId = document.getElementById('leaderSelect').value;
        const leader = db.leaders.find(l => l.id === leaderId);
        if (leader && leader.pass === pass) {
          showLeaderDashboard(leader);
        } else {
          alert('Wrong Password! Use: 123 for Omar');
        }
      }
    }

    function showBoardDashboard() {
      document.getElementById('app').innerHTML = `
        <h2>Board Control</h2>
        <p style="font-size:12px; color:#94a3b8;">Add New HR Leader:</p>
        <input type="text" id="newName" placeholder="Leader Name">
        <input type="text" id="newComm" placeholder="Committee (e.g. PR)">
        <input type="password" id="newPass" placeholder="Password">
        <button onclick="addLeader()">Add Leader</button>
        <button class="logout" onclick="location.reload()">Logout</button>
      `;
    }

    function addLeader() {
      const name = document.getElementById('newName').value;
      const comm = document.getElementById('newComm').value;
      const pass = document.getElementById('newPass').value;
      if(!name || !comm || !pass) { alert('Fill all fields'); return; }
      
      db.leaders.push({ id: 'l_' + Date.now(), name, comm, pass });
      save();
      alert('Leader added successfully!');
      location.reload();
    }

    function showLeaderDashboard(leader) {
      const myMembers = db.members.filter(m => m.leaderId === leader.id);
      document.getElementById('app').innerHTML = `
        <h2>${leader.name} (${leader.comm})</h2>
        <p style="font-size:12px; color:#94a3b8;">Add Your Group Members:</p>
        <input type="text" id="mName" placeholder="Member Full Name">
        <button onclick="addMember('${leader.id}')">Add Member</button>
        
        <div style="max-height: 120px; overflow-y: auto; margin-top: 10px;">
          ${myMembers.map(m => `<div style="background:#0f172a; padding:5px; margin:4px 0; font-size:12px; border-radius:4px; display:flex; justify-content:space-between;"><span>${m.name}</span></div>`).join('')}
        </div>

        <button class="logout" onclick="location.reload()">Logout</button>
      `;
    }

    function addMember(leaderId) {
      const name = document.getElementById('mName').value;
      if(!name) return;
      db.members.push({ id: 'm_' + Date.now(), name, leaderId });
      save();
      const leader = db.leaders.find(l => l.id === leaderId);
      showLeaderDashboard(leader);
    }
  </script>
</body>
</html>
