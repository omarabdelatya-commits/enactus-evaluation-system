<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تقييم إنكتوس قنا</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; text-align: center; }
        h1 { color: #fbbf24; font-size: 24px; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
        .btn { display: block; width: 100%; padding: 14px; margin-bottom: 12px; background: #fbbf24; color: #0f172a; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; text-decoration: none; box-sizing: border-box; }
        .btn:hover { background: #f59e0b; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Enactus Qena</h1>
        <p>نظام تقييم الأعضاء والليدرز</p>
        
        <div id="content">
            <button class="btn" onclick="openBoard()">دخول مدير المجلس (Board)</button>
            <button class="btn" onclick="openLeader()" style="background: #334155; color: #fff;">دخول قائد الموارد البشرية (HR Leader)</button>
        </div>
    </div>

    <script>
        function openBoard() {
            let pass = prompt("أدخل كلمة المرور (board123):");
            if (pass === "board123") {
                document.getElementById('content').innerHTML = `
                    <h3 style="color: #34d399;">مرحباً بك يا مدير المجلس!</h3>
                    <p>تم تسجيل الدخول بنجاح والنظام يعمل بكفاءة تامة.</p>
                    <button class="btn" onclick="location.reload()">تسجيل الخروج</button>
                `;
            } else if (pass !== null) {
                alert("كلمة المرور غير صحيحة! كلمة المرور الافتراضية هي: board123");
            }
        }

        function openLeader() {
            let name = prompt("أدخل اسم قائد HR:");
            if (name) {
                document.getElementById('content').innerHTML = `
                    <h3 style="color: #34d399;">مرحباً بك يا ليدر ${name}!</h3>
                    <p>تم تسجيل الدخول بنجاح لمجموعة التقييم.</p>
                    <button class="btn" onclick="location.reload()">تسجيل الخروج</button>
                `;
            }
        }
    </script>
</body>
</html>
