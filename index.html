<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enactus Qena Evaluation System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700 text-center">
    <h1 class="text-3xl font-bold text-emerald-400 mb-2">Enactus Qena</h1>
    <p class="text-slate-400 text-sm mb-6">Evaluation System is Live & Online</p>
    
    <div class="bg-slate-900 p-4 rounded-xl text-left text-xs font-mono text-emerald-300 border border-slate-700 mb-6 space-y-1">
      <p>Status: Fully Operational ✅</p>
      <p>Platform: Vercel Cloud ✅</p>
      <p>Version: 5.0 (Clean Build)</p>
    </div>

    <button onclick="openApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition">
      Launch Evaluation Panel
    </button>
  </div>

  <script>
    function openApp() {
      document.body.innerHTML = `
        <div class="max-w-xl w-full bg-white text-slate-800 rounded-2xl shadow-2xl p-8">
          <div class="flex justify-between items-center border-b pb-4 mb-6">
            <h2 class="text-xl font-bold text-emerald-700">Enactus Qena Dashboard</h2>
            <button onclick="location.reload()" class="bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold">Logout</button>
          </div>
          <div class="space-y-4">
            <div class="bg-slate-50 p-4 rounded-xl border">
              <label class="block text-xs font-bold text-slate-700 mb-1">Member Name</label>
              <input type="text" id="mName" placeholder="Enter member name" class="w-full p-3 border rounded-xl text-sm mb-3 bg-white" />
              
              <label class="block text-xs font-bold text-slate-700 mb-1">Final Score (0-100)</label>
              <input type="number" id="mScore" value="95" class="w-full p-3 border rounded-xl text-sm font-bold text-emerald-700 mb-4 bg-white" />
              
              <button onclick="saveMember()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl shadow">Save Evaluation</button>
            </div>
            <div id="resultBox" class="text-xs text-slate-500 text-center"></div>
          </div>
        </div>
      `;
    }

    function saveMember() {
      const name = document.getElementById('mName').value;
      const score = document.getElementById('mScore').value;
      if(!name) { alert('Please enter name'); return; }
      document.getElementById('resultBoxinnerHTML = `<p class="text-emerald-600 font-bold">Successfully saved evaluation for ${name} (${score}/100)!</p>`;
      alert(`Evaluation saved for ${name}!`);
    }
  </script>

</body>
</html>
