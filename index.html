<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enactus Qena Evaluation System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

  <div id="app" class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-200">
    <!-- App will load here -->
  </div>

  <script>
    let db = JSON.parse(localStorage.getItem('enactus_db_v4')) || {
      leaders: [
        { id: "omar_pm", name: "Omar (PM Leader - Group 1)", user: "omar_pm", pass: "omar123", committee: "PM" },
        { id: "mohamed_pm", name: "Mohamed (PM Leader - Group 2)", user: "mohamed_pm", pass: "mohamed123", committee: "PM" },
        { id: "ali_pr", name: "Ali (PR Leader)", user: "ali_pr", pass: "ali123", committee: "PR" },
        { id: "nour_hr", name: "Nour (HR Leader)", user: "nour_hr", pass: "nour123", committee: "HR" },
        { id: "ziad_media", name: "Ziad (Media Leader)", user: "ziad_media", pass: "ziad123", committee: "Media" },
        { id: "salma_pres", name: "Salma (Presentation Leader)", user: "salma_pres", pass: "salma123", committee: "Presentation" },
        { id: "youssef_oc", name: "Youssef (OC Leader)", user: "youssef_oc", pass: "youssef123", committee: "OC" }
      ],
      boardPass: "board123",
      evaluations: []
    };

    function saveDB() {
      localStorage.setItem('enactus_db_v4', JSON.stringify(db));
    }

    let activeTab = 'leader';
    let currentUser = null;

    function renderLogin() {
      const app = document.getElementById('app');
      app.className = "max-w-md w-full bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-200";
      
      app.innerHTML = `
        <div class="mb-6 text-center">
          <h1 class="text-2xl font-extrabold text-slate-900">Enactus Qena</h1>
          <p class="text-slate-500 text-sm">Evaluation System Login</p>
        </div>

        <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-xl mb-6 font-bold text-sm">
          <button onclick="switchTab('leader')" class="py-2.5 rounded-lg transition ${activeTab === 'leader' ? 'bg-slate-900 text-white shadow' : 'text-slate-600'}">
            HR Leader Login
          </button>
          <button onclick="switchTab('board')" class="py-2.5 rounded-lg transition ${activeTab === 'board' ? 'bg-slate-900 text-white shadow' : 'text-slate-600'}">
            Board Admin
          </button>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
          ${activeTab === 'leader' ? `
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Select HR Leader Name</label>
              <select id="leaderSelect" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium">
                ${db.leaders.map(l => `<option value="${l.id}">${l.name} [Username: ${l.user}]</option>`).join('')}
              </select>
            </div>
          ` : `
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Board Administrator</label>
              <input type="text" disabled value="Enactus Qena Board (Username: board)" class="w-full p-3 bg-slate-100 border border-slate-200 rounded-xl text-sm font-medium text-slate-500" />
            </div>
          `}

          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Password</label>
            <input type="password" id="passwordInput" required placeholder="Enter password" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none focus:ring-2 focus:ring-slate-900" />
          </div>

          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow transition mt-2">
            Sign In
          </button>
        </form>
      `;
    }

    function switchTab(tab) {
