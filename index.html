<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enactus Qena Evaluation</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #fbbf24; margin-top: 0; }
        label { display: block; margin-top: 15px; font-size: 13px; font-weight: bold; color: #cbd5e1; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 20px; background: #fbbf24; color: #0f172a; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #f59e0b; }
        .success { text-align: center; color: #34d399; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box" id="app">
        <h2>Enactus Qena</h2>
        <p style="text-align: center; color: #94a3b8; font-size: 13px;">System Check</p>

        <label>Select Role:</label>
        <select id="role" onchange="toggleRole()">
            <option value="board">Board Admin</option>
            <option value="leader">HR Leader</option>
        </select>

        <div id="boardBox">
            <label>Board Admin Name:</label>
            <input type="text" id="bName" value="Board Admin">
        </div>

        <div id="leaderBox" style="display:none;">
            <label>HR Leader Name:</label>
            <input type="text" id="lName" value="Omar Leader">
        </div>

        <label>Password:</label>
        <input type="password" id="pass" placeholder="Enter password (board123)">

        <button onclick="doLogin()">Sign In</button>
    </div>

    <script>
        function toggleRole() {
            var role = document.getElementById('role').value;
            if(role === 'board') {
                document.getElementById('boardBox').style.display = 'block';
                document.getElementById('leaderBox').style.display = 'none';
            } else {
                document.getElementById('boardBox').style.display = 'none';
                document.getElementById('leaderBox').style.display = 'block';
            }
        }

        function doLogin() {
            var role = document.getElementById('role').value;
            var pass = document.getElementById('pass').value;

            if(role === 'board') {
                if(pass === 'board123') {
                    document.getElementById('app').innerHTML = '<h2 class="success">Welcome Board Admin!</h2><p style="text-align:center; color:#cbd5e1;">System is working perfectly.</p><button onclick="location.reload()">Logout</button>';
                } else {
                    alert('Wrong Password! Use: board123');
                }
            } else {
                document.getElementById('app').innerHTML = '<h2 class="success">Welcome HR Leader!</h2><p style="text-align:center; color:#cbd5e1;">System is working perfectly.</p><button onclick="location.reload()">Logout</button>';
            }
        }
    </script>
</body>
</html>
