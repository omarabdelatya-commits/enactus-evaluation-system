<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enactus Qena Evaluation System</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .card { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { text-align: center; color: #fbbf24; margin-bottom: 5px; }
        p.sub { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: bold; color: #cbd5e1; }
        input, select { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 13px; }
        button { width: 100%; padding: 12px; background: #fbbf24; color: #0f172a; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        button:hover { background: #f59e0b; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Enactus Qena</h2>
        <p class="sub">Evaluation System Online</p>
        <label>Enter Your Name:</label>
        <input type="text" id="nameInput" placeholder="Your Name">
        <button onclick="alert('System Works Successfully, Omar!')">Test System</button>
    </div>
</body>
</html>
