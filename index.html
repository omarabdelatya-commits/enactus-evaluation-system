<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enactus Qena Evaluation System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div id="app" class="max-w-xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
        <!-- Dynamic App Container -->
    </div>

    <script>
        // Database Initialization
        let db = JSON.parse(localStorage.getItem('enactus_master_v4')) || {
            board: { name: "Omar", pass: "board123" },
            leaders: [
                { id: "l1", name: "Ahmed HR", committee: "PM", pass: "123" }
            ],
            members: [],
            evaluations: [],
            personalCriteria: [
                { name: "Commitment & Attendance", max: 5 },
                { name: "Task Responsibility", max: 5 },
                { name: "Teamwork & Cooperation", max: 5 },
                { name: "Communication", max: 5 }
            ],
            techCriteria: {
                PM: [{ name: "Problem Solving", max: 30 }, { name: "Project Planning", max: 30 }],
                PR: [{ name: "Negotiation", max: 30 }, { name: "Sponsorship", max: 30 }],
                HR: [{ name: "Recruitment", max: 30 }, { name: "Member Relations", max: 30 }],
                Media: [{ name: "Design Quality", max: 30 }, { name: "Content Creation", max: 30 }],
                Presentation: [{ name: "Public Speaking", max: 30 }, { name: "Slide Design", max: 30 }],
                OC: [{ name: "Logistics", max: 30 }, { name: "Execution", max: 30 }]
            }
        };

        function saveDB() {
            localStorage.setItem('enactus_master_v4', JSON.stringify(db));
        }

        let currentView = 'login'; // login, dashboard, eval
        let loginRole = 'leader'; // leader, board
        let currentUser = null;
        let activeMember = null;

        function render() {
            const app = document.getElementById('app');

            if (currentView === 'login') {
                app.innerHTML = `
                    <div class="text-center mb-6">
                        <h1 class="text-2xl font-extrabold text-emerald-400">Enactus Qena</h1>
                        <p class="text-xs text-slate-400">Evaluation System Login</p>
                    </div>

                    <div class="grid grid-cols-2 bg-slate-900 p-1 rounded-xl mb-6 text-xs font-bold border border-slate-700">
                        <button onclick="setLoginRole('leader')" class="py-2.5 rounded-lg transition ${loginRole === 'leader' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400'}">HR Leader</button>
                        <button onclick="setLoginRole('board')" class="py-2.5 rounded-lg transition ${loginRole === 'board' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400'}">Board Admin</button>
                    </div>

                    <div class="space-y-4 text-xs">
                        ${loginRole === 'leader' ? `
                            <div>
                                <label class="block text-slate-300 font-bold mb-1">Select Committee:</label>
                                <select id="commSelect" onchange="updateLeaderDropdown()" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white font-medium">
                                    ${Object.keys(db.techCriteria).map(c => `<option value="${c}">${c}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-slate-300 font-bold mb-1">Select HR Leader Name:</label>
                                <select id="leaderSelect" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white font-medium">
                                    <!-- Dynamic -->
                                </select>
                            </div>
                        ` : `
                            <div>
                                <label class="block text-slate-300 font-bold mb-1">Board Admin Username</label>
                                <input type="text" id="boardNameInput" value="${db.board.name}" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white font-bold" />
                            </div>
                        `}

                        <div>
                            <label class="block text-slate-300 font-bold mb-1">Password:</label>
                            <input type="password" id="passInput" placeholder="${loginRole === 'board' ? 'Enter: board123' : 'Enter Leader Password'}" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white" />
                        </div>

                        <button onclick="handleLogin()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3.5 rounded-xl shadow text-sm transition mt-2">Sign In</button>
                    </div>
                `;
                if (loginRole === 'leader') updateLeaderDropdown();
            } 
            else if (currentView === 'dashboard') {
                const members = currentUser.role === 'hr' ? db.members.filter(m => m.leaderId === currentUser.id) : db.members;

                app.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-700 pb-4 mb-6">
                        <div>
                            <h2 class="font-bold text-emerald-400 text-base">${currentUser.name}</h2>
                            <p class="text-xs text-slate-400">${currentUser.role === 'hr' ? 'Committee: ' + currentUser.committee : 'Board Administration'}</p>
                        </div>
                        <button onclick="logout()" class="bg-red-900/50 text-red-300 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-red-900">Logout</button>
                    </div>

                    ${currentUser.role === 'hr' ? `
                        <div class="space-y-4 text-xs">
                            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3">
                                <h3 class="font-bold text-emerald-400 text-sm">👥 My Group Members (${members.length})</h3>
                                <div class="flex gap-2">
                                    <input type="text" id="newMemName" placeholder="Enter Member Name" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white" />
                                    <button onclick="addMember()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 font-bold rounded-lg text-white">Add</button>
                                </div>
                            </div>

                            <div class="space-y-2 max-h-60 overflow-y-auto">
                                ${members.length === 0 ? '<p class="text-center text-slate-500 py-6">No members added yet.</p>' :
                                    members.map(m => `
                                        <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 flex justify-between items-center">
                                            <span class="font-bold text-white text-sm">${m.name}</span>
                                            <div class="flex gap-2">
                                                <button onclick="openEval('${m.id}')" class="bg-emerald-600/50 text-emerald-300 px-3 py-1 rounded font-bold hover:bg-emerald-600">Evaluate & SWOT</button>
                                                <button onclick="deleteMember('${m.id}')" class="bg-red-900/50 text-red-300 px-2 py-1 rounded font-bold hover:bg-red-900">Remove</button>
                                            </div>
                                        </div>
                                    `).join('')}
                            </div>
                        </div>
                    ` : `
                        <div class="space-y-4 text-xs max-h-[70vh] overflow-y-auto pr-1">
                            <!-- Add HR Leader Box -->
                            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3">
                                <h3 class="font-bold text-amber-400 text-sm">➕ Add New HR Leader</h3>
                                <input type="text" id="lName" placeholder="Leader Full Name" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white font-bold" />
                                <select id="lComm" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white font-bold">
                                    ${Object.keys(db.techCriteria).map(c => `<option value="${c}">${c}</option>`).join('')}
                                </select>
                                <input type="password" id="lPass" placeholder="Password for Leader" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white font-bold" />
                                <button onclick="addLeader()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-lg">Add Leader</button>
                            </div>

                            <!-- Manage Criteria & Max Marks / Add & Delete Criteria -->
                            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3">
                                <h3 class="font-bold text-sky-400 text-sm">⚙️ Manage Personal Criteria & Max Marks</h3>
                                <div class="space-y-2">
                                    ${db.personalCriteria.map((c, i) => `
                                        <div class="flex justify-between items-center bg-slate-800 p-2 rounded gap-2">
                                            <input type="text" value="${c.name}" onchange="updatePCritName(${i}, this.value)" class="bg-slate-900 text-white p-1 rounded text-xs w-full border border-slate-700" />
                                            <input type="number" value="${c.max}" onchange="updatePCritMax(${i}, this.value)" class="w-16 p-1 bg-slate-900 text-center font-bold text-sky-400 rounded border border-slate-700" />
                                            <button onclick="deletePCrit(${i})" class="bg-red-900/50 text-red-300 px-2 py-1 rounded font-bold">X</button>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="flex gap-2 pt-2">
                                    <input type="text" id="newPCName" placeholder="New Criterion Name" class="p-2 bg-slate-800 text-white rounded text-xs w-full border border-slate-700" />
                                    <input type="number" id="newPCMax" placeholder="Max" value="5" class="p-2 bg-slate-800 text-white rounded text-xs w-16 border border-slate-700 text-center font-bold" />
                                    <button onclick="addPCrit()" class="bg-emerald-600 text-white px-3 py-1.5 rounded text-xs font-bold">Add</button>
                                </div>
                            </div>

                            <!-- Manage Leaders List (Reset Passwords & Delete) -->
                            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-2">
                                <h3 class="font-bold text-blue-400 text-sm">👥 Manage HR Leaders (${db.leaders.length})</h3>
                                <div class="space-y-2 max-h-48 overflow-y-auto">
                                    ${db.leaders.map((l, idx) => `
                                        <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 space-y-2">
                                            <div class="flex justify-between items-center">
                                                <span class="font-bold text-white">${l.name} <span class="text-emerald-400">[${l.committee}]</span></span>
                                                <button onclick="deleteLeader('${l.id}')" class="bg-red-900/50 text-red-300 px-2 py-1 rounded font-bold text-[11px]">Delete</button>
                                            </div>
                                            <div class="flex gap-2">
                                                <input type="text" id="reset_pass_${l.id}" placeholder="New Password" class="p-1.5 bg-slate-900 text-white rounded text-xs w-full border border-slate-700" />
                                                <button onclick="resetLeaderPass('${l.id}')" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1 rounded font-bold text-xs">Reset Pass</button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `}
                `;
            }
            else if (currentView === 'eval') {
                const comm = currentUser.committee;
                const techList = db.techCriteria[comm] || [];

                app.innerHTML = `
                    <div class="space-y-4 text-xs">
                        <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                            <h2 class="font-bold text-emerald-400 text-sm">Evaluating: ${activeMember.name}</h2>
                            <button onclick="currentView='dashboard'; render();" class="bg-slate-700 text-white px-3 py-1.5 rounded-lg">Back</button>
                        </div>

                        <div class="bg-slate-950 p-4 rounded-xl border border-emerald-900/50 space-y-2">
                            <h3 class="font-bold text-emerald-400 text-xs">Personal Criteria</h3>
                            ${db.personalCriteria.map((c, i) => `
                                <div class="flex justify-between items-center bg-slate-900 p-2 rounded">
                                    <span class="text-slate-300">${c.name} (Max: ${c.max})</span>
                                    <input type="number" id="p_${i}" value="${c.max}" max="${c.max}" min="0" class="w-16 p-1 bg-slate-800 border border-slate-700 text-center rounded text-emerald-400 font-bold" />
                                </div>
                            `).join('')}
                        </div>

                        <div class="bg-slate-950 p-4 rounded-xl border border-sky-900/50 space-y-2">
                            <h3 class="font-bold text-sky-400 text-xs">Technical Criteria (${comm})</h3>
                            ${techList.map((c, i) => `
                                <div class="flex justify-between items-center bg-slate-900 p-2 rounded">
                                    <span class="text-slate-300">${c.name} (Max: ${c.max})</span>
                                    <input type="number" id="t_${i}" value="${c.max}" max="${c.max}" min="0" class="w-16 p-1 bg-slate-800 border border-slate-700 text-center rounded text-sky-400 font-bold" />
                                </div>
                            `).join('')}
                        </div>

                        <div class="bg-slate-950 p-4 rounded-xl border border-amber-900/50 space-y-3">
                            <h3 class="font-bold text-amber-400 text-xs">Individual Assessment & SWOT Analysis</h3>
                            <textarea id="indNotes" placeholder="Individual assessment notes..." class="w-full p-2 bg-slate-900 border border-slate-700 rounded text-white h-16"></textarea>
                            <div class="grid grid-cols-2 gap-2">
                                <textarea id="swotS" placeholder="Strengths" class="p-2 bg-slate-900 border border-slate-700 rounded text-white h-14"></textarea>
                                <textarea id="swotW" placeholder="Weaknesses" class="p-2 bg-slate-900 border border-slate-700 rounded text-white h-14"></textarea>
                            </div>
                        </div>

                        <button onclick="saveEvaluation()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3.5 rounded-xl shadow text-sm">Save & Submit Evaluation</button>
                    </div>
                `;
            }
        }

        function setLoginRole(role) {
            loginRole = role;
            render();
        }

        function updateLeaderDropdown() {
            const comm = document.getElementById('commSelect').value;
            const select = document.getElementById('leaderSelect');
            const filtered = db.leaders.filter(l => l.committee === comm);
            select.innerHTML = filtered.length === 0 ? '<option value="">No leaders found</option>' :
                filtered.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
        }

        function handleLogin() {
            const pass = document.getElementById('passInput').value.trim();

            if (loginRole === 'board') {
                const boardName = document.getElementById('boardNameInput').value.trim();
                db.board.name = boardName || "Omar";
                if (pass === db.board.pass) {
                    currentUser = { role: 'board', name: db.board.name };
                    currentView = 'dashboard';
                    saveDB();
                    render();
                } else {
                    alert('Wrong Board Password! Use: board123');
                }
            } else {
                const leaderId = document.getElementById('leaderSelect').value;
                const leader = db.leaders.find(l => l.id === leaderId);
                if (leader && leader.pass === pass) {
                    currentUser = { role: 'hr', name: leader.name, committee: leader.committee, id: leader.id };
                    currentView = 'dashboard';
                    render();
                } else {
                    alert('Wrong Leader Password!');
                }
            }
        }

        function addLeader() {
            const name = document.getElementById('lName').value.trim();
            const committee = document.getElementById('lComm').value;
            const pass = document.getElementById('lPass').value.trim();
            if (!name || !pass) { alert('Please fill all fields'); return; }
            
            db.leaders.push({ id: 'l_' + Date.now(), name, committee, pass });
            saveDB();
            alert(`HR Leader ${name} added successfully!`);
            render();
        }

        function deleteLeader(id) {
            if (db.leaders.length <= 1) { alert('You must keep at least one leader.'); return; }
            if (confirm('Are you sure you want to delete this leader?')) {
                db.leaders = db.leaders.filter(l => l.id !== id);
                saveDB();
                render();
            }
        }

        function resetLeaderPass(id) {
            const newPass = document.getElementById(`reset_pass_${id}`).value.trim();
            if (!newPass) { alert('Enter new password'); return; }
            const leader = db.leaders.find(l => l.id === id);
            if (leader) {
                leader.pass = newPass;
                saveDB();
                alert(`Password for ${leader.name} updated successfully!`);
                render();
            }
        }

        function updatePCritName(idx, val) {
            db.personalCriteria[idx].name = val;
            saveDB();
        }

        function updatePCritMax(idx, val) {
            db.personalCriteria[idx].max = Number(val);
            saveDB();
        }

        function deletePCrit(idx) {
            db.personalCriteria.splice(idx, 1);
            saveDB();
            render();
        }

        function addPCrit() {
            const name = document.getElementById('newPCName').value.trim();
            const max = Number(document.getElementById('newPCMax').value);
            if (!name) { alert('Enter criterion name'); return; }
            db.personalCriteria.push({ name, max });
            saveDB();
            render();
        }

        function addMember() {
            const name = document.getElementById('newMemName').value.trim();
            if (!name) { alert('Enter member name'); return; }
            db.members.push({ id: 'm_' + Date.now(), name, leaderId: currentUser.id });
            saveDB();
            render();
        }

        function deleteMember(id) {
            if (confirm("Remove this member?")) {
                db.members = db.members.filter(m => m.id !== id);
                saveDB();
                render();
            }
        }

        function openEval(id) {
            activeMember = db.members.find(m => m.id === id);
            currentView = 'eval';
            render();
        }

        function saveEvaluation() {
            let total = 0;
            db.personalCriteria.forEach((c, i) => total += Number(document.getElementById(`p_${i}`).value || 0));
            const techList = db.techCriteria[currentUser.committee] || [];
            techList.forEach((c, i) => total += Number(document.getElementById(`t_${i}`).value || 0));

            alert(`Evaluation saved successfully for ${activeMember.name}!\nTotal Score: ${total} Marks`);
            currentView = 'dashboard';
            render();
        }

        function logout() {
            currentUser = null;
            currentView = 'login';
            render();
        }

        render();
    </script>
</body>
</html>
