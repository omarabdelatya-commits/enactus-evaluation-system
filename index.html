<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enactus Qena Evaluation System</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .card { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { text-align: center; color: #fbbf24; margin-bottom: 5px; }
        p.sub { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: bold; color: #cbd5e1; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 13px; }
        button { width: 100%; padding: 12px; background: #fbbf24; color: #0f172a; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        button:hover { background: #f59e0b; }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; background: #0f172a; padding: 4px; border-radius: 8px; border: 1px solid #334155; }
        .tab-btn { flex: 1; padding: 10px; background: transparent; color: #94a3b8; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .tab-btn.active { background: #fbbf24; color: #0f172a; }
        .btn-danger { background: #991b1b; color: #f87171; margin-top: 5px; }
        .btn-danger:hover { background: #7f1d1d; }
        .badge { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: bold; display: inline-block; }
        .b-warn { background: #451a03; color: #f87171; border: 1px solid #991b1b; }
        .b-bronze { background: #451a03; color: #fb923c; border: 1px solid #c2410c; }
        .b-silver { background: #334155; color: #e2e8f0; border: 1px solid #64748b; }
        .b-gold { background: #422006; color: #facc15; border: 1px solid #ca8a04; }
        .b-best { background: #064e3b; color: #34d399; border: 1px solid #059669; }
    </style>
</head>
<body>

    <div class="card" id="app">
        <!-- Dynamic Content -->
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('enactus_perfect_v1')) || {
            board: { name: "Board Admin", pass: "board123" },
            leaders: [],
            members: [],
            evaluations: [],
            personalCriteria: [
                { name: "Commitment & Attendance", max: 5 },
                { name: "Task Responsibility", max: 5 },
                { name: "Teamwork & Cooperation", max: 5 },
                { name: "Communication", max: 5 }
            ],
            techCriteria: {
                PM: [{ name: "Problem Solving", max: 30 }, { name: "Project Planning", max: 30 }],
                PR: [{ name: "Negotiation", max: 30 }, { name: "Sponsorship", max: 30 }],
                HR: [{ name: "Recruitment", max: 30 }, { name: "Member Relations", max: 30 }],
                Media: [{ name: "Design Quality", max: 30 }, { name: "Content Creation", max: 30 }]
            }
        };

        function saveDB() {
            localStorage.setItem('enactus_perfect_v1', JSON.stringify(db));
        }

        let loginRole = 'leader';
        let currentView = 'login';
        let currentUser = null;
        let activeMember = null;

        function getTier(score) {
            if (score < 55) return { name: "Warning", class: "b-warn", emoji: "⚠️" };
            if (score < 65) return { name: "Bronze", class: "b-bronze", emoji: "🥉" };
            if (score < 85) return { name: "Silver", class: "b-silver", emoji: "🥈" };
            if (score < 95) return { name: "Gold", class: "b-gold", emoji: "🥇" };
            return { name: "Best", class: "b-best", emoji: "💎" };
        }

        function render() {
            const app = document.getElementById('app');

            if (currentView === 'login') {
                app.innerHTML = `
                    <h2>Enactus Qena</h2>
                    <p class="sub">Evaluation System</p>
                    
                    <div class="tabs">
                        <button class="tab-btn ${loginRole === 'leader' ? 'active' : ''}" onclick="setRole('leader')">HR Leader</button>
                        <button class="tab-btn ${loginRole === 'board' ? 'active' : ''}" onclick="setRole('board')">Board Admin</button>
                    </div>

                    ${loginRole === 'leader' ? `
                        <label>Select Committee:</label>
                        <select id="commSelect" onchange="updateLeaderDropdown()">
                            ${Object.keys(db.techCriteria).map(c => `<option value="${c}">${c}</option>`).join('')}
                        </select>
                        <label>Select HR Leader Name:</label>
                        <select id="leaderSelect"></select>
                    ` : `
                        <label>Board Admin Name:</label>
                        <input type="text" id="boardNameInput" value="${db.board.name}" placeholder="Enter your name">
                    `}

                    <label>Password:</label>
                    <input type="password" id="passInput" placeholder="••••••••">

                    <button onclick="handleLogin()">Sign In</button>
                `;
                if (loginRole === 'leader') updateLeaderDropdown();
            } 
            else if (currentView === 'dashboard') {
                if (currentUser.role === 'board') {
                    app.innerHTML = `
                        <h2>Welcome, ${currentUser.name}</h2>
                        <p class="sub">Board Administration (Full Access)</p>
                        
                        <!-- Change Board Password & Name -->
                        <div style="background:#0f172a; padding:12px; border-radius:8px; margin-bottom:12px; border:1px solid #334155;">
                            <label style="color:#fbbf24;">Update Board Account:</label>
                            <input type="text" id="updBoardName" value="${db.board.name}" placeholder="New Board Name">
                            <input type="password" id="updBoardPass" placeholder="New Password (Leave blank to keep current)">
                            <button onclick="updateBoard()">Save Changes</button>
                        </div>

                        <!-- Add Leader -->
                        <div style="background:#0f172a; padding:12px; border-radius:8px; margin-bottom:12px; border:1px solid #334155;">
                            <label style="color:#fbbf24;">Add New HR Leader:</label>
                            <input type="text" id="lName" placeholder="Leader Full Name">
                            <select id="lComm">
                                ${Object.keys(db.techCriteria).map(c => `<option value="${c}">${c}</option>`).join('')}
                            </select>
                            <input type="password" id="lPass" placeholder="Password">
                            <button onclick="addLeader()">Add Leader</button>
                        </div>

                        <!-- Members Report -->
                        <div style="background:#0f172a; padding:12px; border-radius:8px; margin-bottom:12px; border:1px solid #334155;">
                            <label style
