<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enactus Qena Evaluation</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 12px; width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { text-align: center; color: #fbbf24; margin-top: 0; }
        label { display: block; margin-top: 15px; font-size: 13px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 20px; background: #fbbf24; color: #0f172a; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #f59e0b; }
    </style>
</head>
<body>

    <div class="box" id="app">
        <h2>Enactus Qena</h2>
        <label>اختر نوع الدخول:</label>
        <select id="roleSelect" onchange="changeRole()">
            <option value="board">مدير المجلس (Board Admin)</option>
            <option value="leader">قائد HR (HR Leader)</option>
        </select>

        <div id="boardGroup">
            <label>اسم البورد:</label>
            <input type="text" id="bName" value="Board Admin">
        </div>

        <div id="leaderGroup" style="display:none;">
            <label>اسم قائد الـ HR:</label>
            <input type="text" id="lName" value="Leader Name">
        </div>

        <label>كلمة المرور:</label>
        <input type="password" id="passInput" placeholder="••••••••">

        <button onclick="login()">تسجيل الدخول</button>
    </div>

    <script>
        function changeRole() {
            var role = document.getElementById('roleSelect').value;
            if(role === 'board') {
                document.getElementById('boardGroup').style.display = 'block';
                document.getElementById('leaderGroup').style.display = 'none';
            } else {
                document.getElementById('boardGroup').style.display = 'none';
                document.getElementById('leaderGroup').style.display = 'block';
            }
        }

        function login() {
            var pass = document.getElementById('passInput').value;
            if(pass === "board123" || pass === "123") {
                document.getElementById('app').innerHTML = `
                    <h2 style="color: #34d399;">تم الدخول بنجاح!</h2>
                    <p style="text-align: center; color: #cbd5e1;">أهلاً بك في نظام تقييم إنكتوس قنا.</p>
                    <button onclick="location.reload()" style="background:#dc2626; color:#fff;">تسجيل الخروج</button>
                `;
            } else {
                alert("كلمة المرور غير صحيحة! (جرب: board123)");
            }
        }
    </script>
</body>
</html>
