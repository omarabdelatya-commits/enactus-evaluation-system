<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enactus Qena Evaluation System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div id="app" class="max-w-3xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 border border-slate-700">
    <!-- App Container -->
  </div>

  <script>
    let db = JSON.parse(localStorage.getItem('enactus_db_v8')) || {
      leaders: [
        { id: "omar_pm", name: "Omar", committee: "PM", role: "HR Leader", pass: "omar123" },
        { id: "mohamed_pr", name: "Mohamed", committee: "PR", role: "HR Leader", pass: "pr123" },
        { id: "nour_hr", name: "Nour", committee: "HR", role: "HR Leader", pass: "hr123" }
      ],
      members: [
        { id: "m1", name: "Ahmed Ali", leaderId: "omar_pm", committee: "PM" }
      ],
      boardPass: "board123",
      evaluations: []
    };

    function saveDB() {
      localStorage.setItem('enactus_db_v8', JSON.stringify(db));
    }

    const committeeTechCriteria = {
      PM: [
        "Research & Problem Identification (10)",
        "Research Quality & Validation (10)",
        "Project Planning & Documentation (10)",
        "Task Execution & Deliverables (10)",
        "Critical Thinking & Problem Solving (10)",
        "Project Development & Practical Contribution (10)"
      ],
      PR: [
        "Communication & Negotiation (10)",
        "Sponsorship Research & Prospecting (10)",
        "Outreach & Follow-up (10)",
        "Partnership Development (10)",
        "Proposal & Pitch Quality (10)",
        "Task Execution & Reporting (10)"
      ],
      HR: [
        "HR Knowledge & Application (10)",
        "Recruitment & Interviewing (10)",
        "Data Management & Documentation (10)",
        "Member Follow-up & Evaluation (10)",
        "Conflict Handling & Fairness (10)",
        "Confidentiality & Professional HR Practice (10)"
      ],
      Media: [
        "Content Creation & Copywriting (10)",
        "Design / Editing Quality (10)",
        "Branding & Visual Consistency (10)",
        "Content Planning & Execution (10)",
        "Creativity & Audience Relevance (10)",
        "Technical Skills & File Management (10)"
      ],
      Presentation: [
        "Presentation Structure & Storytelling (10)",
        "Research & Content Accuracy (10)",
        "Slide Design & Visual Communication (10)",
        "Public Speaking & Delivery (10)",
        "Persuasion & Audience Engagement (10)",
        "Rehearsal, Feedback & Improvement (10)"
      ],
      OC: [
        "Event Planning & Preparation (10)",
        "Logistics & Resource Management (10)",
        "Coordination & Task Distribution (10)",
        "On-ground Execution (10)",
        "Contingency Planning & Problem Solving (10)",
        "Post-event Reporting & Organization (10)"
      ]
    };

    const personalCriteria = [
      "Commitment & Attendance (5)",
      "Task Commitment & Responsibility (5)",
      "Social Media Engagement (5)",
      "Respect for Hierarchy & Professionalism (5)",
      "Communication & Responsiveness (5)",
      "Teamwork & Cooperation (5)",
      "Initiative & Problem Solving (5)",
      "Feedback & Improvement (5)"
    ];

    let activeTab = 'leader';
    let currentUser = null;

    function renderLogin() {
      const app = document.getElementById('app');
      app.className = "max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 border border-slate-700";
      
      app.innerHTML = `
        <div class="mb-6 text-center">
          <h1 class="text-2xl font-extrabold text-emerald-400">Enactus Qena</h1>
          <p class="text-slate-400 text-sm">Evaluation System Login</p>
        </div>

        <div class="grid grid-cols-2 bg-slate-900 p-1 rounded-xl mb-6 font-bold text-sm border border-slate-700">
          <button onclick="switchTab('leader')" class="py-2.5 rounded-lg transition ${activeTab === 'leader' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}">
            HR Leader
          </button>
          <button onclick="switchTab('board')" class="py-2.5 rounded-lg transition ${activeTab === 'board' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}">
            Board Admin
          </button>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
          ${activeTab === 'leader' ? `
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">Select HR Leader</label>
              <select id="leaderSelect" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm font-medium text-white outline-none">
                ${db.leaders.map(l => `<option value="${l.id}">${l.name} [${l.committee}]</option>`).join('')}
              </select>
            </div>
          ` : `
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">Board Administrator</label>
              <input type="text" disabled value="Enactus Qena Board (Password: board123)" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm font-medium text-slate-400 cursor-not-allowed" />
            </div>
          `}

          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Password</label>
            <input type="password" id="passwordInput" required placeholder="Enter password" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm font-medium text-white outline-none focus:border-emerald-500" />
          </div>

          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow transition mt-2">
            Sign In
          </button>
        </form>
      `;
    }

    function switchTab(tab) {
      activeTab = tab;
      renderLogin();
    }

    function handleLogin(e) {
      e.preventDefault();
      const pass = document.getElementById('passwordInput').value.trim();

      if (activeTab === 'board') {
        if (pass === db.boardPass) {
          currentUser = { role: 'board', name: 'Board Administrator' };
          renderDashboard('settings');
        } else {
          alert('Incorrect Board Password! (Default: board123)');
        }
      } else {
        const leaderId = document.getElementById('leaderSelect').value;
        const leader = db.leaders.find(l => l.id === leaderId);
        if (leader && leader.pass === pass) {
          currentUser = { role: 'hr', name: leader.name, committee: leader.committee, id: leader.id };
          renderDashboard('form');
        } else {
          alert('Incorrect Password for this Leader!');
        }
      }
    }

    function renderDashboard(subTab) {
      const app = document.getElementById('app');
      app.className = "max-w-3xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 border border-slate-700";
      
      const commKey = currentUser.role === 'hr' ? currentUser.committee : 'PM';
      const techList = committeeTechCriteria[commKey] || committeeTechCriteria['PM'];
      const myMembers = currentUser.role === 'hr' ? db.members.filter(m => m.leaderId === currentUser.id) : db.members;

      let contentHtml = '';

      if (subTab === 'form' && currentUser.role === 'hr') {
        contentHtml = `
          <form onsubmit="submitEvaluation(event)" class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-slate-900 p-4 rounded-xl border border-slate-700">
              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">Select Member</label>
                <select id="memberSelect" required class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white font-bold">
                  <option value="">-- Choose Member --</option>
                  ${myMembers.map(m => `<option value="${m.name}">${m.name}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">Month</label>
                <select id="evalMonth" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white">
                  ${['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'].map(m => `<option value="${m}">${m}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">Committee</label>
                <input type="text" disabled value="${currentUser.committee} (${currentUser.name})" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-sm font-bold text-emerald-400 cursor-not-allowed" />
              </div>
            </div>

            <div class="border border-emerald-900/50 rounded-xl p-4 bg-emerald-950/25 space-y-3">
              <h3 class="text-base font-bold text-emerald-400">1. Personal Evaluation (Out of 40)</h3>
              ${personalCriteria.map((crit, idx) => `
                <div class="flex justify-between items-center bg-slate-900 p-3 rounded-lg border border-slate-700 text-xs gap-2">
                  <span class="font-medium text-slate-300">${idx + 1}.${crit}</span>
                  <input type="number" min="0" max="5" value="5" id="per_${idx}" oninput="calculateTotal()" class="w-16 p-1.5 bg-slate-800 border border-slate-700 text-center font-bold text-emerald-400 rounded" />
                </div>
              `).join('')}
            </div>

            <div class="border border-sky-900/50 rounded-xl p-4 bg-sky-950/25 space-y-3">
              <h3 class="text-base font-bold text-sky-400">2. Technical Evaluation: ${commKey} Committee (Out of 60)</h3>
              ${techList.map((crit, idx) => `
                <div class="flex justify-between items-center bg-slate-900 p-3 rounded-lg border border-slate-700 text-xs gap-2">
                  <span class="font-medium text-slate-300">${idx + 1}.${crit}</span>
                  <input type="number" min="0" max="10" value="10" id="tech_${idx}" oninput="calculateTotal()" class="w-16 p-1.5 bg-slate-800 border border-slate-700 text-center font-bold text-sky-400 rounded" />
                </div>
              `).join('')}
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center bg-slate-900 text-white p-5 rounded-xl border border-slate-700 gap-4">
              <div>
                <span class="text-slate-400 text-xs block">Final Total Score:</span>
                <span id="finalScoreDisplay" class="text-2xl font-extrabold text-emerald-400">100 / 100 Marks</span>
              </div>
              <button type="submit" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-3 rounded-xl shadow transition">
                Save & Submit Evaluation
              </button>
            </div>
          </form>
        `;
      } else if (subTab === 'members' && currentUser.role === 'hr') {
        contentHtml = `
          <div class="space-y-6 bg-slate-900 p-6 rounded-2xl border border-slate-700">
            <div class="flex justify-between items-center">
              <div>
                <h3 class="font-bold text-emerald-400 text-lg">👥 My Group Members (${myMembers.length})</h3>
                <p class="text-xs text-slate-400">Add the members you are responsible for evaluating.</p>
              </div>
              <button onclick="addNewMember()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold">+ Add Member</button>
            </div>

            <div class="space-y-2 max-h-96 overflow-y-auto">
              ${myMembers.length === 0 ? '<p class="text-sm text-slate-400 text-center py-8">No members added yet.</p>' :
                myMembers.map((m, idx) => `
                  <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-between items-center text-sm">
                    <span class="font-bold text-white">${idx + 1}.${m.name}</span>
                    <button onclick="deleteMember('${m.id}')" class="bg-red-900/50 text-red-300 px-3 py-1 rounded text-xs font-bold hover:bg-red-900">Remove</button>
                  </div>
                `).join('')}
            </div>
          </div>
        `;
      } else if (subTab === 'records') {
        const myEvals = currentUser.role === 'board' ? db.evaluations : db.evaluations.filter(e => e.evaluatorId === currentUser.id);
        contentHtml = `
          <div class="space-y-4">
            <h3 class="font-bold text-white text-lg">📊 Submitted Records (${myEvals.length})</h3>
            <div class="space-y-2 max-h-96 overflow-y-auto">
              ${myEvals.length === 0 ? '<p class="text-sm text-slate-400 text-center py-8">No evaluations submitted yet.</p>' : 
                myEvals.map(ev => `
                  <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 flex justify-between items-center text-sm">
                    <div>
                      <h4 class="font-bold text-emerald-400">${ev.name}</h4>
                      <p class="text-xs text-slate-400">Committee: <b>${ev.comm}</b> | Month: ${ev.month} \vert{} Leader:${ev.evaluator}</p>
                    </div>
                    <span class="font-extrabold text-emerald-400 text-base">${ev.score}/100</span>
                  </div>
                `).join('')}
            </div>
          </div>
        `;
      } else if (subTab === 'settings' && currentUser.role === 'board') {
        contentHtml = `
          <div class="space-y-6 bg-slate-900 p-6 rounded-2xl border border-slate-700">
            <h3 class="font-bold text-emerald-400 text-lg mb-2">➕ Add New HR Leader</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs bg-slate-800 p-4 rounded-xl border border-slate-700">
              <div>
                <label class="block text-slate-400 mb-1">Leader Name</label>
                <input type="text" id="newName" placeholder="e.g. Mahmoud" class="w-full p-2 bg-slate-900 border border-slate-700 text-white rounded font-bold" />
              </div>
              <div>
                <label class="block text-slate-400 mb-1">Committee (e.g. PM)</label>
                <input type="text" id="newComm" placeholder="PM" class="w-full p-2 bg-slate-900 border border-slate-700 text-emerald-400 rounded font-bold uppercase" />
              </div>
              <div>
                <label class="block text-slate-400 mb-1">Password</label>
                <input type="text" id="newPass" placeholder="Password" class="w-full p-2 bg-slate-900 border border-slate-700 text-white rounded font-mono font-bold" />
              </div>
              <div class="flex items-end">
                <button onclick="createLeader()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold p-2.5 rounded shadow">Add Leader</button>
              </div>
            </div>

            <h3 class="font-bold text-blue-400 text-lg pt-4">⚙️ Manage Existing Leaders</h3>
            <div class="space-y-3 max-h-72 overflow-y-auto">
              ${db.leaders.map((l, idx) => `
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 grid grid-cols-1 sm:grid-cols-4 gap-3 items-center text-xs">
                  <div>
                    <label class="block text-slate-400 mb-1">Name:</label>
                    <input type="text" id="l_name_${idx}" value="${l.name}" class="w-full p-2 bg-slate-900 border border-slate-700 text-white rounded font-bold" />
                  </div>
                  <div>
                    <label class="block text-slate-400 mb-1">Committee:</label>
                    <input type="text" id="l_comm_${idx}" value="${l.committee}" class="w-full p-2 bg-slate-900 border border-slate-700 text-emerald-400 rounded font-bold uppercase" />
                  </div>
                  <div>
                    <label class="block text-slate-400 mb-1">New Password:</label>
                    <input type="text" id="l_pass_${idx}" value="${l.pass}" class="w-full p-2 bg-slate-900 border border-slate-700 text-white rounded font-mono font-bold" />
                  </div>
                  <div class="flex justify-end gap-1 pt-4">
                    <button onclick="updateLeader(${idx})" class="bg-blue-600 text-white px-2 py-1.5 rounded font-bold">Update</button>
                    <button onclick="deleteLeader(${idx})" class="bg-red-900/50 text-red-300 px-2 py-1.5 rounded font-bold">Delete</button>
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="text-center pt-2">
              <button onclick="renderDashboard('records')" class="bg-slate-700 hover:bg-slate-600 text-white font-bold px-6 py-2 rounded-xl text-xs">View All Evaluations</button>
            </div>
          </div>
        `;
      }
      
      app.innerHTML = `
        <div class="flex justify-between items-center border-b border-slate-700 pb-4 mb-6">
          <div>
            <h2 class="text-xl font-bold text-emerald-400">Enactus Qena Evaluation</h2>
            <p class="text-xs text-slate-400">Logged in as: <span class="font-bold text-white">${currentUser.name}</span> (${currentUser.role === 'hr' ? currentUser.committee + ' Committee' : 'Board Admin'})</p>
          </div>
          <button onclick="handleLogout()" class="bg-red-900/50 text-red-300 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-red-900">
            Logout
          </button>
        </div>

        <div class="flex gap-2 mb-6 flex-wrap">
          ${currentUser.role === 'hr' ? `
            <button onclick="renderDashboard('form')" class="px-4 py-2 rounded-xl text-xs font-bold ${subTab === 'form' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-300 border border-slate-700'}">New Evaluation</button>
            <button onclick="renderDashboard('members')" class="px-4 py-2 rounded-xl text-xs font-bold ${subTab === 'members' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-300 border border-slate-700'}">👥 My Members (${myMembers.length})</button>
          ` : ''}
          <button onclick="renderDashboard('records')" class="px-4 py-2 rounded-xl text-xs font-bold ${subTab === 'records' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-300 border border-slate-700'}">View Records</button>
          ${currentUser.role === 'board' ? `<button onclick="renderDashboard('settings')" class="px-4 py-2 rounded-xl text-xs font-bold ${subTab === 'settings' ? 'bg-blue-600 text-white' : 'bg-slate-900 text-slate-300 border border-slate-700'}">⚙️ Board Management</button>` : ''}
        </div>

        ${contentHtml}
      `;
      if (subTab === 'form' && currentUser.role === 'hr') calculateTotal();
    }

    function calculateTotal() {
      let perTotal = 0;
      for (let i = 0; i < 8; i++) perTotal += Number(document.getElementById(`per_${i}`)?.value || 0);
      
      const commKey = currentUser.committee;
      const techList = committeeTechCriteria[commKey] || committeeTechCriteria['PM'];
      
      let techTotal = 0;
      for (let i = 0; i < techList.length; i++) techTotal += Number(document.getElementById(`tech_${i}`)?.value || 0);

      const final = perTotal + techTotal;
      const display = document.getElementById('finalScoreDisplay');
      if (display) display.innerText = `${final} / 100 Marks`;
    }

    function addNewMember() {
      const name = prompt("Enter Member Full Name:");
      if (!name) return;
      db.members.push({ id: 'm_' + Date.now(), name: name.trim(), leaderId: currentUser.id, committee: currentUser.committee });
      saveDB();
      renderDashboard('members');
    }

    function deleteMember(id) {
      if (confirm("Are you sure you want to remove this member?")) {
        db.members = db.members.filter(m => m.id !== id);
        saveDB();
        renderDashboard('members');
      }
    }

    function submitEvaluation(e) {
      e.preventDefault();
      const name = document.getElementById('memberSelect').value;
      const month = document.getElementById('evalMonth').value;
      if (!name) {
        alert('Please select a member!');
        return;
      }
      
      let perTotal = 0;
      for (let i = 0; i < 8; i++) perTotal += Number(document.getElementById(`per_${i}`).value || 0);
      
      const commKey = currentUser.committee;
      const techList = committeeTechCriteria[commKey] || committeeTechCriteria['PM'];
      let techTotal = 0;
      for (let i = 0; i < techList.length; i++) techTotal += Number(document.getElementById(`tech_${i}`).value || 0);
      
      const score = perTotal + techTotal;

      db.evaluations.unshift({
        id: Date.now(),
        name,
        month,
        score,
        comm: commKey,
        evaluator: currentUser.name,
        evaluatorId: currentUser.id
      });
      saveDB();
      alert(`Evaluation saved successfully for ${name}!\nFinal Score: ${score} / 100`);
      renderDashboard('records');
    }

    function createLeader() {
      const name = document.getElementById('newName').value.trim();
      const committee = document.getElementById('newComm').value.trim().toUpperCase();
      const pass = document.getElementById('newPass').value.trim();

      if (!name || !committee || !pass) {
        alert("Please fill in all fields!");
        return;
      }

      db.leaders.push({ id: 'leader_' + Date.now(), name, committee, role: 'HR Leader', pass });
      saveDB();
      alert(`Leader ${name} added successfully!`);
      renderDashboard('settings');
    }

    function updateLeader(idx) {
      db.leaders[idx].name = document.getElementById(`l_name_${idx}`).value.trim();
      db.leaders[idx].committee = document.getElementById(`l_comm_${idx}`).value.trim().toUpperCase();
      db.leaders[idx].pass = document.getElementById(`l_pass_${idx}`).value.trim();
      saveDB();
      alert('Leader updated successfully!');
      renderDashboard('settings');
    }

    function deleteLeader(idx) {
      if (db.leaders.length <= 1) {
        alert("You must keep at least one HR leader.");
        return;
      }
      if (confirm("Are you sure you want to delete this leader?")) {
        db.leaders.splice(idx, 1);
        saveDB();
        renderDashboard('settings');
      }
    }

    function handleLogout() {
      currentUser = null;
      renderLogin();
    }

    renderLogin();
