<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enactus Qena Evaluation System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">
  <div id="app" class="min-h-screen flex items-center justify-center p-4">
    <!-- App content will render here automatically -->
  </div>

  <script>
    const committees = {
      PM: { name: "PM Committee (Project Management)", user: "hr_pm", leader: "PM HR Leader" },
      PR: { name: "PR Committee (Public Relations)", user: "hr_pr", leader: "PR HR Leader" },
      HR: { name: "HR Committee (Human Resources)", user: "hr_hr", leader: "HR HR Leader" },
      Media: { name: "Media Committee", user: "hr_media", leader: "Media HR Leader" },
      Presentation: { name: "Presentation Committee", user: "hr_pres", leader: "Presentation HR Leader" },
      OC: { name: "OC Committee (Organizing)", user: "hr_oc", leader: "OC HR Leader" }
    };

    let currentUser = null;

    function renderLogin() {
      document.getElementById('app').innerHTML = `
        <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8">
          <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-emerald-700">Enactus Qena Evaluation</h1>
            <p class="text-slate-500 text-sm mt-1">Sign in with your Username</p>
          </div>
          <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
              <input type="text" id="usernameInput" required placeholder="e.g. board or hr_pm" class="w-full p-3 border rounded-xl text-sm bg-slate-50 font-medium focus:ring-2 focus:ring-emerald-500 outline-none" />
              <div class="text-xs text-slate-500 mt-2 bg-slate-50 p-3 rounded-xl border space-y-1">
                <p class="font-bold text-slate-700">💡 Available Usernames:</p>
                <p>• Board Admin: <code class="text-blue-700 font-bold">board</code></p>
                <p>• PM Committee: <code class="text-emerald-700 font-bold">hr_pm</code></p>
                <p>• PR Committee: <code class="text-emerald-700 font-bold">hr_pr</code></p>
                <p>• HR Committee: <code class="text-emerald-700 font-bold">hr_hr</code></p>
                <p>• Media Committee: <code class="text-emerald-700 font-bold">hr_media</code></p>
                <p>• Presentation: <code class="text-emerald-700 font-bold">hr_pres</code></p>
                <p>• OC Committee: <code class="text-emerald-700 font-bold">hr_oc</code></p>
              </div>
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition mt-4">
              Sign In
            </button>
          </form>
        </div>
      `;
    }

    function handleLogin(e) {
      e.preventDefault();
      const val = document.getElementById('usernameInput').value.trim().toLowerCase();

      if (val === 'board' || val === 'admin') {
        currentUser = { role: 'board', name: 'Board Management' };
        renderDashboard();
        return;
      }

      let foundKey = null;
      for (const [key, comm] of Object.entries(committees)) {
        if (comm.user === val) {
          foundKey = key;
          break;
        }
      }

      if (foundKey) {
        currentUser = { role: 'hr', name: committees[foundKey].leader, committee: foundKey, committeeName: committees[foundKey].name };
        renderDashboard();
      } else {
        alert('Invalid Username! Please check available usernames.');
      }
    }

    function renderDashboard() {
      const commTitle = currentUser.role === 'board' ? 'Board Full Access' : currentUser.committeeName;
      document.getElementById('app').innerHTML = `
        <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden p-6 sm:p-10">
          <div class="flex flex-col sm:flex-row justify-between items-center border-b pb-4 mb-6 gap-4">
            <div>
              <h1 class="text-xl sm:text-2xl font-bold text-emerald-700">Enactus Qena Evaluation System</h1>
              <p class="text-slate-500 text-xs sm:text-sm">User: <span class="font-bold text-slate-800">${currentUser.name}</span> (${commTitle})</p>
            </div>
            <button onclick="handleLogout()" class="bg-red-100 text-red-600 px-4 py-2 rounded-lg text-xs font-bold hover:bg-red-200 transition">
              Logout
            </button>
          </div>

          <div class="bg-emerald-50 border border-emerald-200 p-6 rounded-2xl space-y-4">
            <h2 class="text-lg font-bold text-emerald-800">🚀 System is Live and Fully Operational!</h2>
            <p class="text-sm text-slate-600">You are successfully logged in as <b>${currentUser.name}</b>.</p>
            
            <div class="space-y-3 pt-2">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Member Full Name</label>
                <input type="text" id="memberName" placeholder="Enter member name" class="w-full p-3 border rounded-xl text-sm bg-white" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Final Score (Out of 100)</label>
                <input type="number" id="memberScore" value="95" min="0" max="100" class="w-full p-3 border rounded-xl text-sm bg-white font-bold text-emerald-700" />
              </div>
              <button onclick="saveEval()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl shadow transition">
                Submit & Save Evaluation
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function saveEval() {
      const name = document.getElementById('memberName').value;
      const score = document.getElementById('memberScore').value;
      if (!name) {
        alert('Please enter member name!');
        return;
      }
      alert(`Evaluation saved successfully for ${name} with score ${score}/100!`);
      document.getElementById('memberName').value = '';
    }

    function handleLogout() {
      currentUser = null;
      renderLogin();
    }

    renderLogin();
  </script>
</body>
</html>
