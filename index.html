<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enactus Qena Evaluation System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div id="app" class="max-w-3xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 border border-slate-700">
    <!-- App Container -->
  </div>

  <script>
    let db = JSON.parse(localStorage.getItem('enactus_final_v12')) || {
      leaders: [
        { id: "l1", name: "Omar", committee: "PM", pass: "123" },
        { id: "l2", name: "Ahmed", committee: "PR", pass: "123" }
      ],
      members: [],
      evaluations: [],
      boardPass: "board123"
    };

    function saveDB() {
      localStorage.setItem('enactus_final_v12', JSON.stringify(db));
    }

    const committeeTechCriteria = {
      PM: ["Research & Problem Identification (10)", "Research Quality & Validation (10)", "Project Planning & Documentation (10)", "Task Execution & Deliverables (10)", "Critical Thinking & Problem Solving (10)", "Project Development & Practical Contribution (10)"],
      PR: ["Communication & Negotiation (10)", "Sponsorship Research & Prospecting (10)", "Outreach & Follow-up (10)", "Partnership Development (10)", "Proposal & Pitch Quality (10)", "Task Execution & Reporting (10)"],
      HR: ["HR Knowledge & Application (10)", "Recruitment & Interviewing (10)", "Data Management & Documentation (10)", "Member Follow-up & Evaluation (10)", "Conflict Handling & Fairness (10)", "Confidentiality & Professional HR Practice (10)"],
      Media: ["Content Creation & Copywriting (10)", "Design / Editing Quality (10)", "Branding & Visual Consistency (10)", "Content Planning & Execution (10)", "Creativity & Audience Relevance (10)", "Technical Skills & File Management (10)"],
      Presentation: ["Presentation Structure & Storytelling (10)", "Research & Content Accuracy (10)", "Slide Design & Visual Communication (10)", "Public Speaking & Delivery (10)", "Persuasion & Audience Engagement (10)", "Rehearsal, Feedback & Improvement (10)"],
      OC: ["Event Planning & Preparation (10)", "Logistics & Resource Management (10)", "Coordination & Task Distribution (10)", "On-ground Execution (10)", "Contingency Planning & Problem Solving (10)", "Post-event Reporting & Organization (10)"]
    };

    const personalCriteria = [
      "Commitment & Attendance (5)", "Task Commitment & Responsibility (5)", "Social Media Engagement (5)", 
      "Respect for Hierarchy & Professionalism (5)", "Communication & Responsiveness (5)", "Teamwork & Cooperation (5)", 
      "Initiative & Problem Solving (5)", "Feedback & Improvement (5)"
    ];

    let activeTab = 'leader';
    let currentUser = null;

    function renderLogin() {
      const app = document.getElementById('app');
      app.className = "max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 border border-slate-700";
      
      app.innerHTML = `
        <div class="mb-6 text-center">
          <h1 class="text-2xl font-extrabold text-emerald-400">Enactus Qena</h1>
          <p class="text-slate-400 text-sm">Evaluation System Login</p>
        </div>

        <div class="grid grid-cols-2 bg-slate-900 p-1 rounded-xl mb-6 font-bold text-sm border border-slate-700">
          <button onclick="switchTab('leader')" class="py-2.5 rounded-lg transition ${activeTab === 'leader' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}">HR Leader</button>
          <button onclick="switchTab('board')" class="py-2.5 rounded-lg transition ${activeTab === 'board' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}">Board Admin</button>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
          ${activeTab === 'leader' ? `
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">Select Committee</label>
              <select id="commSelect" onchange="updateLeaderDropdown()" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm font-medium text-white outline-none">
                ${Object.keys(committeeTechCriteria).map(c => `<option value="${c}">${c}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">Select HR Leader Name</label>
              <select id="leaderSelect" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm font-medium text-white outline-none">
                <!-- Dynamically filled -->
              </select>
            </div>
          ` : `
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">Board Administrator</label>
              <input type="text" disabled value="Enactus Board Admin" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm font-medium text-slate-400 cursor-not-allowed" />
            </div>
          `}

          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Password</label>
            <input type="password" id="passwordInput" required placeholder="Enter password" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm font-medium text-white outline-none focus:border-emerald-500" />
          </div>

          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow transition mt-2">Sign In</button>
        </form>
      `;
      if (activeTab === 'leader') updateLeaderDropdown();
    }

    function switchTab(tab) {
      activeTab = tab;
      renderLogin();
    }

    function updateLeaderDropdown() {
      const comm = document.getElementById('commSelect').value;
      const leaderSel = document.getElementById('leaderSelect');
      const filtered = db.leaders.filter(l => l.committee === comm);
      
      leaderSel.innerHTML = filtered.length === 0 ? '<option value="">No leaders in this committee</option>' :
        filtered.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
    }

    function handleLogin(e) {
      e.preventDefault();
      const pass = document.getElementById('passwordInput').value.trim();

      if (activeTab === 'board') {
        if (pass === db.boardPass) {
          currentUser = { role: 'board', name: 'Board Administrator' };
          renderDashboard('settings');
        } else {
          alert('Incorrect Board Password! (Default: board123)');
        }
      } else {
        const leaderId = document.getElementById('leaderSelect').value;
        const leader = db.leaders.find(l => l.id === leaderId);
        if (leader && leader.pass === pass) {
          currentUser = { role: 'hr', name: leader.name, committee: leader.committee, id: leader.id };
          renderDashboard('members');
        } else {
          alert('Incorrect Password! (Default is 123)');
        }
      }
    }

    function renderDashboard(subTab) {
      const app = document.getElementById('app');
      app.className = "max-w-3xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 border border-slate-700";
      
      const myMembers = currentUser.role === 'hr' ? db.members.filter(m => m.leaderId === currentUser.id) : db.members;

      let contentHtml = '';

      if (subTab === 'members' && currentUser.role === 'hr') {
        contentHtml = `
          <div class="space-y-6 bg-slate-900 p-6 rounded-2xl border border-slate-700">
            <div class="flex justify-between items-center flex-wrap gap-2">
              <div>
                <h3 class="font-bold text-emerald-400 text-lg">👥 My Group Members (${myMembers.length})</h3>
                <p class="text-xs text-slate-400">Add members you are responsible for evaluating.</p>
              </div>
              <div class="flex gap-2 w-full sm:w-auto">
                <input type="text" id="newMemberName" placeholder="Member Full Name" class="p-2 bg-slate-800 border border-slate-700 rounded-lg text-xs text-white" />
                <button onclick="addMember()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-xs font-bold">+ Add</button>
              </div>
            </div>

            <div class="space-y-2 max-h-96 overflow-y-auto">
              ${myMembers.length === 0 ? '<p class="text-sm text-slate-400 text-center py-8">No members added yet.</p>.' :
                myMembers.map((m, idx) => `
                  <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-between items-center text-sm">
                    <span class="font-bold text-white">${idx + 1}. ${m.name}</span>
                    <div class="flex gap-2">
                      <button onclick="openEvalForm('${m.id}')" class="bg-emerald-600/50 text-emerald-300 px-3 py-1 rounded text-xs font-bold hover:bg-emerald-600">Evaluate</button>
                      <button onclick="deleteMember('${m.id}')" class="bg-red-900/50 text-red-300 px-3 py-1 rounded text-xs font-bold hover:bg-red-900">Remove</button>
                    </div>
                  </div>
                `).join('')}
            </div>
          </div>
        `;
      } else if (subTab === 'evalForm' && currentUser.role === 'hr') {
        const memberId = window.activeMemberId;
        const member = db.members.find(m => m.id === memberId);
        const commKey = currentUser.committee;
        const techList = committeeTechCriteria[commKey];

        contentHtml = `
          <form onsubmit="submitEvaluation(event, '${memberId}')" class="space-y-6">
            <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-700">
              <div>
                <h3 class="text-emerald-400 font-bold text-base">Evaluating: ${member.name}</h3>
                <p class="text-xs text-slate-400">Committee: ${commKey} | Leader: ${currentUser.name}</p>
              </div>
              <button type="button" onclick="renderDashboard('members')" class="bg-slate-700 text-white px-3 py-1 rounded text-xs">Back to Members</button>
            </div>

            <div class="border border-emerald-900/50 rounded-xl p-4 bg-emerald-950/25 space-y-3">
              <h4 class="text-sm font-bold text-emerald-400">1. Personal Evaluation (Out of 40)</h4>
              ${personalCriteria.map((crit, idx) => `
                <div class="flex justify-between items-center bg-slate-900 p-3 rounded-lg border border-slate-700 text-xs gap-2">
                  <span class="text-slate-300">${idx + 1}. ${crit}</span>
                  <input type="number" min="0" max="5" value="5" id="per_${idx}" oninput="calcScore()" class="w-16 p-1.5 bg-slate-800 text-center font-bold text-emerald-400 rounded border border-slate-700" />
                </div>
              `).join('')}
            </div>

            <div class="border border-sky-900/50 rounded-xl p-4 bg-sky-950/25 space-y-3">
              <h4 class="text-sm font-bold text-sky-400">2. Technical Evaluation: ${commKey} (Out of 60)</h4>
              ${techList.map((crit, idx) => `
                <div class="flex justify-between items-center bg-slate-900 p-3 rounded-lg border border-slate-700 text-xs gap-2">
                  <span class="text-slate-300">${idx + 1}. ${crit}</span>
                  <input type="number" min="0" max="10" value="10" id="tech_${idx}" oninput="calcScore()" class="w-16 p-1.5 bg-slate-800 text-center font-bold text-sky-400 rounded border border-slate-700" />
                </div>
              `).join('')}
            </div>

            <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-700">
              <div>
                <span class="text-xs text-slate-400">Final Total Score:</span>
                <span id="finalScore" class="text-xl font-extrabold text-emerald-400">100 / 100 Marks</span>
              </div>
              <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2.5 rounded-xl text-xs">Save Evaluation</button>
            </div>
          </form>
        `;
      } else if (subTab === 'records') {
        const myEvals = currentUser.role === 'board' ? db.evaluations : db.evaluations.filter(e => e.evaluatorId === currentUser.id);
        contentHtml = `
          <div class="space-y-4">
            <h3 class="font-bold text-white text-lg">📊 Submitted Evaluations (${myEvals.length})</h3>
            <div class="space-y-2 max-h-96 overflow-y-auto">
              ${myEvals.length === 0 ? '<p class="text-sm text-slate-400 text-center py-8">No evaluations found.</p>' :
                myEvals.map(ev => `
                  <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 flex justify-between items-center text-sm">
                    <div>
                      <h4 class="font-bold text-emerald-400">${ev.memberName}</h4>
                      <p class="text-xs text-slate-400">Committee: ${ev.comm} | Evaluator: ${ev.evaluatorName}</p>
                    </div>
                    <span class="font-extrabold text-emerald-400 text-base">${ev.score} / 100</span>
                  </div>
                `).join('')}
            </div>
          </div>
        `;
      } else if (subTab === 'settings' && currentUser.role === 'board') {
        contentHtml = `
          <div class="space-y-6 bg-slate-900 p-6 rounded-2xl border border-slate-700">
            <h3 class="font-bold text-emerald-400 text-sm">➕ Add New HR Leader</h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
              <input type="text" id="newName" placeholder="Leader Name" class="p-2.5 bg-slate-800 border border-slate-700 text-white rounded font-bold" />
              <input type="text" id="newComm" placeholder="Committee (PM, PR...)" class="p-2.5 bg-slate-800 border border-slate-700 text-emerald-400 rounded font-bold uppercase" />
              <input type="text" id="newPass" placeholder="Password" class="p-2.5 bg-slate-800 border border-slate-700 text-white rounded font-mono font-bold" />
            </div>
            <button onclick="createLeader()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold p-2.5 rounded-lg text-xs">Add Leader</button>

            <h3 class="font-bold text-blue-400 text-sm pt-4">⚙️ Manage Leaders (${db.leaders.length})</h3>
            <div class="space-y-2 max-h-60 overflow-y-auto">
              ${db.leaders.map((l, idx) => `
                <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-between items-center text-xs">
                  <div>
                    <span class="font-bold text-white">${l.name}</span>
                    <span class="text-emerald-400 ml-2">[${l.committee}]</span>
                  </div>
                  <button onclick="deleteLeader('${l.id}')" class="bg-red-900/50 text-red-300 px-3 py-1 rounded font-bold hover:bg-red-900">Delete</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      app.innerHTML = `
        <div class="flex justify-between items-center border-b border-slate-700 pb-4 mb-6">
          <div>
            <h2 class="text-xl font-bold text-emerald-400">Enactus Qena Portal</h2>
            <p class="text-xs text-slate-400">Logged in as: <span class="font-bold text-white">${currentUser.name}</span></p>
          </div>
          <button onclick="logout()" class="bg-red-900/50 text-red-300 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-red-900">Logout</button>
        </div>

        <div class="flex gap-2 mb-6 flex-wrap">
          ${currentUser.role === 'hr' ? `
            <button onclick="renderDashboard('members')" class="px-4 py-2 rounded-xl text-xs font-bold ${subTab === 'members' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-300 border border-slate-700'}">👥 My Members (${myMembers.length})</button>
          ` : ''}
          <button onclick="renderDashboard('records')" class="px-4 py-2 rounded-xl text-xs font-bold ${subTab === 'records' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-300 border border-slate-700'}">View Evaluations</button>
          ${currentUser.role === 'board' ? `<button onclick="renderDashboard('settings')" class="px-4 py-2 rounded-xl text-xs font-bold ${subTab === 'settings' ? 'bg-blue-600 text-white' : 'bg-slate-900 text-slate-300 border border-slate-700'}">⚙️ Board Management</button>` : ''}
        </div>

        ${contentHtml}
      `;
      if (subTab === 'evalForm') calcScore();
    }

    function calcScore() {
      let per = 0;
      for (let i = 0; i < 8; i++) per += Number(document.getElementById(`per_${i}`)?.value || 0);
      const commKey = currentUser.committee;
      const techList = committeeTechCriteria[commKey];
      let tech = 0;
      for (let i = 0; i < techList.length; i++) tech += Number(document.getElementById(`tech_${i}`)?.value || 0);
      const total = per + tech;
      const disp = document.getElementById('finalScore');
      if (disp) disp.innerText = `${total} / 100 Marks`;
    }

    function addMember() {
      const name = document.getElementById('newMemberName').value.trim();
      if (!name) { alert('Enter member name'); return; }
      db.members.push({ id: 'm_' + Date.now(), name, leaderId: currentUser.id, committee: currentUser.committee });
      saveDB();
      renderDashboard('members');
    }

    function deleteMember(id) {
      if (confirm("Remove member?")) {
        db.members = db.members.filter(m => m.id !== id);
        saveDB();
        renderDashboard('members');
      }
    }

    function openEvalForm(memberId) {
      window.activeMemberId = memberId;
      renderDashboard('evalForm');
    }

    function submitEvaluation(e, memberId) {
      e.preventDefault();
      let per = 0;
      for (let i = 0; i < 8; i++) per += Number(document.getElementById(`per_${i}`).value);
      const techList = committeeTechCriteria[currentUser.committee];
      let tech = 0;
      for (let i = 0; i < techList.length; i++) tech += Number(document.getElementById(`tech_${i}`).value);
      
      const score = per + tech;
      const member = db.members.find(m => m.id === memberId);

      db.evaluations.unshift({
        id: Date.now(),
        memberName: member.name,
        score,
        comm: currentUser.committee,
        evaluatorName: currentUser.name,
        evaluatorId: currentUser.id
      });
      saveDB();
      alert(`Evaluation saved for ${member.name}!\nFinal Score: ${score}/100`);
      renderDashboard('records');
    }

    function createLeader() {
      const name = document.getElementById('newName').value.trim();
      const committee = document.getElementById('newComm').value.trim().toUpperCase();
      const pass = document.getElementById('newPass').value.trim();
      if (!name || !committee || !pass) { alert('Fill all fields'); return; }
      db.leaders.push({ id: 'l_' + Date.now(), name, committee, pass });
      saveDB();
      alert('Leader added successfully!');
      renderDashboard('settings');
    }

    function deleteLeader(id) {
      if (db.leaders.length <= 1) { alert('Keep at least one leader'); return; }
      if (confirm('Delete this leader?')) {
        db.leaders = db.leaders.filter(l => l.id !== id);
        saveDB();
        renderDashboard('settings');
      }
    }

    function logout() {
      currentUser = null;
      renderLogin();
    }

    renderLogin();
  </script>
</body>
</html>
